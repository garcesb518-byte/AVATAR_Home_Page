<button id="chat-toggle" type="button" aria-label="Ask AVATAR AI" aria-expanded="false">💬 Ask AVATAR AI</button>

<section id="chat-panel" hidden aria-label="AVATAR AI chat">
  <header>
    <strong>AVATAR AI</strong>
    <button id="chat-close" type="button" aria-label="Close chat">&times;</button>
  </header>
  <div id="chat-log" aria-live="polite"></div>
  <form id="chat-form">
    <input id="chat-input" type="text" maxlength="500" placeholder="Ask about campus energy…" autocomplete="off" required>
    <button type="submit">Send</button>
  </form>
</section>

<style>
  #chat-toggle {
  position: fixed; bottom: 20px; right: 20px; z-index: 1000;
  height: 60px; padding: 0 22px; border: 0; border-radius: 30px;
  background: #00205b; color: #fff; font: 600 17px system-ui, sans-serif;
  cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,.35);
  }
  #chat-panel {
    position: fixed; bottom: 92px; right: 20px; z-index: 1000;
    width: min(360px, calc(100vw - 40px)); height: min(480px, 70vh);
    display: flex; flex-direction: column; background: #fff;
    border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.3);
    font: 15px/1.4 system-ui, sans-serif; color: #222;
  }
  #chat-panel[hidden] { display: none; }
  #chat-panel header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; background: #00205b; color: #fff;
  }
  #chat-close { background: none; border: 0; color: #fff; font-size: 24px; cursor: pointer; }
  #chat-log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .chat-msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .chat-bot { align-self: flex-start; background: #eef0f4; }
  .chat-user { align-self: flex-end; background: #00205b; color: #fff; }
  #chat-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #ddd; }
  #chat-input { flex: 1; padding: 8px 10px; border: 1px solid #bbb; border-radius: 8px; font: inherit; }
  #chat-form button { padding: 8px 14px; border: 0; border-radius: 8px; background: #00205b; color: #fff; cursor: pointer; }
</style>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const toggle = $("chat-toggle"), panel = $("chat-panel"), closeBtn = $("chat-close"),
        log = $("chat-log"), form = $("chat-form"), input = $("chat-input");

  // Each tab is a full page load, so keep the conversation in sessionStorage.
  let history = [];
  try { history = JSON.parse(sessionStorage.getItem("avatarChat")) || []; } catch (e) {}
  const save = () => { try { sessionStorage.setItem("avatarChat", JSON.stringify(history)); } catch (e) {} };

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "chat-msg chat-" + role;
    div.textContent = text;            // textContent, never innerHTML
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function setOpen(open) {
    panel.hidden = !open;
    toggle.setAttribute("aria-expanded", String(open));
    try { sessionStorage.setItem("avatarChatOpen", open ? "1" : "0"); } catch (e) {}
    if (open) { input.focus(); log.scrollTop = log.scrollHeight; }
  }

  toggle.addEventListener("click", () => setOpen(panel.hidden));
  closeBtn.addEventListener("click", () => { setOpen(false); toggle.focus(); });

  addMessage("bot", "Hi! I'm AVATAR AI. Ask me about campus energy, forecasting, or sustainability.");
  history.forEach((m) => addMessage(m.role === "user" ? "user" : "bot", m.content));
  try { panel.hidden = sessionStorage.getItem("avatarChatOpen") !== "1"; } catch (e) {}

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addMessage("user", text);
    history.push({ role: "user", content: text });
    const pending = addMessage("bot", "Thinking…");
    input.disabled = true;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history.slice(-10) }),
      });
      if (res.status === 429) {
        pending.textContent = "You're sending messages too quickly. Please wait a minute and try again.";
        history.pop();
      } else {
        const data = await res.json();
        const reply = data.reply || "Sorry, something went wrong.";
        pending.textContent = reply;
        if (res.ok) history.push({ role: "assistant", content: reply });
        else history.pop();
      }
    } catch (err) {
      pending.textContent = "Network error. Please try again.";
      history.pop();
    } finally {
      save();
      input.disabled = false;
      input.focus();
      log.scrollTop = log.scrollHeight;
    }
  });
})();
</script>
