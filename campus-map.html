<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Campus Map | AVATAR</title>
  <link rel="stylesheet" href="static/styles.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    html { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      margin: 0;
      overflow: hidden;
    }
    .site-header { flex-shrink: 0; }
    .bldg-item p { margin: 0; }
    .map-notice { position: absolute; top: 12px; left: 50px; right: 12px; z-index: 600; padding: 12px; border: 1px solid #d9e1e8; border-radius: 8px; background: white; font-size: 13px; }

    .map-shell {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 320px;
      min-height: 0;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #e2e5ea;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 10;
    }
    .sidebar-header {
      flex-shrink: 0;
      padding: 18px 20px 14px;
      background: linear-gradient(135deg, #002855, #0a3d6b);
      border-bottom: 1px solid #e2e5ea;
    }
    .sidebar-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin: 0 0 4px;
      letter-spacing: -.02em;
    }
    .sidebar-sub {
      font-size: 12px;
      color: rgba(255,255,255,.75);
      margin: 0;
      line-height: 1.5;
    }

    /* filter pills */
    .filter-row {
      flex-shrink: 0;
      display: flex;
      gap: 6px;
      padding: 12px 20px;
      border-bottom: 1px solid #e2e5ea;
      flex-wrap: wrap;
    }
    .filter-pill {
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 99px;
      border: 1px solid #e2e5ea;
      background: #fff;
      color: #6b7280;
      cursor: pointer;
      white-space: nowrap;
    }
    .filter-pill.on { background: #002855; color: #fff; border-color: #002855; }

    /* building list */
    .bldg-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .bldg-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px 10px 17px;
      cursor: pointer;
      border-bottom: 1px solid #f4f5f7;
      border-left: 3px solid transparent;
      transition: background .1s, border-color .1s;
    }
    .bldg-item:hover, .bldg-item.active { background: #e8eef6; }
    .bldg-item.active { border-left-color: #002855; }
    .type-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px; height: 28px;
      flex-shrink: 0;
      color: var(--marker-color);
    }
    .type-icon svg { width: 24px; height: 24px; }
    .campus-marker { background: transparent; border: 0; }
    .campus-pin {
      width: 36px; height: 44px;
      position: relative;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.3));
    }
    .campus-pin.selected { width: 42px; height: 52px; }
    .pin-outline { width: 100%; height: 100%; display: block; }
    .pin-symbol {
      position: absolute;
      top: 6px; left: 6px;
      width: 24px; height: 24px;
      color: white;
    }
    .selected .pin-symbol { top: 8px; left: 7px; width: 28px; height: 28px; }
    .pin-symbol svg { width: 100%; height: 100%; }
    .campus-marker:focus-visible { outline: 3px solid #002855; outline-offset: 4px; border-radius: 8px; }
    .bldg-item-info { flex: 1; min-width: 0; }
    .bldg-item-name {
      font-size: 13px;
      font-weight: 600;
      color: #0f1923;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bldg-item-type {
      font-size: 11px;
      color: #6b7280;
    }
    .bldg-item-kwh {
      font-size: 12px;
      font-weight: 600;
      color: #0f1923;
      text-align: right;
      flex-shrink: 0;
    }
    .bldg-item-kwh span {
      display: block;
      font-size: 10px;
      font-weight: 400;
      color: #6b7280;
    }

    /* ── MAP ── */
    .map-panel {
      position: relative;
      flex: 1;
      min-width: 0;
      min-height: 0;
    }
    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* ── POPUP ── */
    .leaflet-popup-content-wrapper {
      border-radius: 12px !important;
      box-shadow: 0 8px 32px rgba(0,40,85,.18) !important;
      padding: 0 !important;
      overflow: hidden;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: 300px !important;
    }
    .leaflet-popup-tip-container { display: none; }

    .popup-head {
      background: #002855;
      padding: 14px 16px 12px;
    }
    .popup-type-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(255,255,255,.15);
      color: rgba(255,255,255,.8);
      display: inline-block;
      margin-bottom: 6px;
      letter-spacing: .02em;
    }
    .popup-name {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin: 0;
      letter-spacing: -.02em;
    }
    .popup-body { padding: 14px 16px; background: #fff; }

    .popup-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .ps {
      background: #f4f5f7;
      border-radius: 8px;
      padding: 10px 8px;
      text-align: center;
    }
    .ps-val {
      font-size: 17px;
      font-weight: 700;
      color: #0f1923;
      letter-spacing: -.03em;
      line-height: 1;
      display: block;
    }
    .ps-label {
      font-size: 10px;
      color: #6b7280;
      margin-top: 3px;
      display: block;
      line-height: 1.3;
    }

    .popup-breakdown {
      margin-bottom: 12px;
    }
    .pb-title {
      font-size: 10px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 7px;
    }
    .pb-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }
    .pb-label { font-size: 11px; color: #4b5563; width: 72px; flex-shrink: 0; }
    .pb-track { flex: 1; background: #e2e5ea; border-radius: 99px; height: 5px; }
    .pb-fill { height: 5px; border-radius: 99px; }
    .pb-pct { font-size: 11px; font-weight: 500; color: #0f1923; width: 28px; text-align: right; }

    .popup-tip {
      background: #e8eef6;
      border-left: 3px solid #002855;
      border-radius: 0 6px 6px 0;
      padding: 8px 10px;
      font-size: 12px;
      color: #002855;
      line-height: 1.5;
    }
    .popup-tip strong { font-weight: 700; }

    .popup-data-note {
      font-size: 10px;
      color: #9ca3af;
      margin-top: 10px;
      line-height: 1.4;
    }

    .map-legend {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 500;
      background: #fff;
      border: 1px solid #e2e5ea;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 11px;
      color: #4b5563;
      box-shadow: 0 8px 24px rgba(0,40,85,.12);
    }
    .legend-title {
      font-weight: 700;
      color: #002855;
      margin-bottom: 10px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      padding: 3px 4px;
      border-radius: 6px;
      transition: background .15s;
    }
    .legend-row:hover { background: #f4f5f7; }
    .legend-row .type-icon { width: 22px; height: 22px; }
    .legend-row .type-icon svg { width: 20px; height: 20px; }

    @media (max-width: 700px) {
      .map-shell { flex-direction: column; }
      .sidebar { width: 100%; height: 32%; max-height: 220px; border-right: none; border-bottom: 1px solid #e2e5ea; }
      .map-legend { padding: 6px 8px; font-size: 10px; }
      .legend-row { margin-bottom: 0; }
    }
  </style>
</head>
<body>

<header class="site-header">
    <a class="brand" href="index.html" aria-label="AVATAR homepage">
      <span class="brand-mark" aria-hidden="true"></span>
      <span><strong>AVATAR</strong><small>Advancing Villanova to Energy Autonomy and Resiliency</small></span>
    </a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="main-navigation">Menu</button>
    <nav id="main-navigation" class="main-nav" aria-label="Main navigation"></nav>
  </header>

  <div class="map-shell">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <p class="sidebar-title">Campus Energy Map</p>
        <p class="sidebar-sub">Click a building to see its energy profile. Figures are illustrative estimates.</p>
      </div>
      <div class="filter-row" id="filter-row">
        <button class="filter-pill on" onclick="filterType('All',this)">All</button>
        <button class="filter-pill" onclick="filterType('Residence',this)">Residence</button>
        <button class="filter-pill" onclick="filterType('Academic',this)">Academic</button>
        <button class="filter-pill" onclick="filterType('Athletics',this)">Athletics</button>
        <button class="filter-pill" onclick="filterType('Dining',this)">Dining</button>
        <button class="filter-pill" onclick="filterType('Admin',this)">Admin</button>
      </div>
      <div class="bldg-list" id="bldg-list"></div>
    </div>

    <!-- MAP -->
    <div class="map-panel">
      <div id="map-notice" class="map-notice" hidden></div>
      <div id="map"></div>
      <div class="map-legend">
        <div class="legend-title">Building type</div>
        <div id="legend-items"></div>
      </div>
    </div>

  </div>

  <script>
  // ── BUILDING DATA ──

  var BUILDINGS = [
    // RESIDENCE HALLS
    { id:1,  name:"Stanford Hall",       type:"Residence", lat:40.031927, lng:-75.341448, kwhDay:2410, residents:520,
      breakdown:{HVAC:40,Lighting:23,Appliances:16,"Hot water":14,Other:7},

    { id:27, name:"Saint Monica Hall",   type:"Residence", lat:40.031511, lng:-75.340499, kwhDay:1050, residents:160,
      breakdown:{HVAC:37,Lighting:23,Appliances:16,"Hot water":17,Other:7},
      tip:"St. Monica and St. Katharine Halls are 'twin' South Campus buildings with standard double rooms and no in-room kitchens. With no kitchen appliances to speak of, lights left on in empty lounges are one of the more avoidable losses." },
    { id:28, name:"St. Katharine Hall",  type:"Residence", lat:40.031036, lng:-75.340632, kwhDay:1020, residents:160,
      breakdown:{HVAC:36,Lighting:24,Appliances:15,"Hot water":18,Other:7},
      tip:"Shared hallway showers are the main hot water draw in this traditional-style hall. Low-flow showerheads would reduce usage without affecting comfort." },
    { id:29, name:"Caughlin Hall",       type:"Residence", lat:40.030736, lng:-75.341249, kwhDay:790,  residents:120,
      breakdown:{HVAC:38,Lighting:22,Appliances:15,"Hot water":17,Other:8},

    { id:30, name:"Welsh Hall",          type:"Residence", lat:40.042399, lng:-75.343510, kwhDay:1050, residents:140,
      breakdown:{HVAC:30,Lighting:18,Appliances:33,"Hot water":13,Other:6},

    { id:31, name:"Jackson Hall",        type:"Residence", lat:40.041364, lng:-75.344304, kwhDay:980,  residents:130,

    { id:32, name:"Rudolph Hall",        type:"Residence", lat:40.041652, lng:-75.343172, kwhDay:1020, residents:140,

    { id:33, name:"Gallen Hall",         type:"Residence", lat:40.040847, lng:-75.343982, kwhDay:1080, residents:150,

    { id:34, name:"Moulden Hall",        type:"Residence", lat:40.041299, lng:-75.342973, kwhDay:1000, residents:135,
      breakdown:{HVAC:31,Lighting:17,Appliances:32,"Hot water":13,Other:7},
      tip:"An apartment-style West Campus hall where kitchenette appliances, not HVAC, are the leading cost driver. A unit-by-unit energy challenge could meaningfully cut consumption." },
    { id:35, name:"Farley Hall",         type:"Residence", lat:40.040128, lng:-75.343505, kwhDay:1040, residents:145,

    { id:21, name:"St. Thomas of Villanova Church",type:"Admin",lat:40.035847,lng:-75.343344,kwhDay:420,

    // DINING AREAS
{
  id: 37,
  name: "Dougherty Hall",
  type: "Dining",
  lat: 40.03540424515611,
  lng: -75.34122060915857,
  kwhDay: 760,
  breakdown: {
    HVAC: 25,
    Lighting: 15,
    Appliances: 40,
    "Hot water": 15,
    Other: 5
  },
  tip: "Kitchen equipment and refrigeration can contribute heavily to dining energy use. Turn off idle cooking equipment when safe and appropriate."
},

{
  id: 38,
  name: "Donahue Hall",
  type: "Dining",
  lat: 40.03084214752718,
  lng: -75.3422895086328,
  kwhDay: 650,
  breakdown: {
    HVAC: 25,
    Lighting: 15,
    Appliances: 35,
    "Hot water": 20,
    Other: 5
  },
  tip: "Run dishwashers with full loads and report leaking hot-water fixtures to help reduce energy and water use."
},
{
  id: 39,
  name: "Connelly Center",
  type: "Dining",
  lat: 40.03576736984493,
  lng: -75.34015121264912,
  kwhDay: 900,
  breakdown: {
    HVAC: 30,
    Lighting: 20,
    Appliances: 30,
    "Hot water": 15,
    Other: 5
  },
  tip: "Match lighting and ventilation schedules to dining and event hours to reduce unnecessary energy use."
},
    {
      id: 51,
      name: "Mullen Center for the Performing Arts",
      type: "Other",
      lat: 40.033079,
      lng: -75.339125,
      kwhDay: 1750,
      breakdown: {
        HVAC: 34,
        Lighting: 38,
        Appliances: 20,
        "Hot water": 3,
        Other: 5
      },
      tip: "Home to the Topper and Court Theatres, where stage lighting rigs and tight humidity control for instruments and costumes drive most of the load. Dimming house and rehearsal-room lighting when spaces are unbooked would be the biggest win."
    },
  ];
  var COLOR = {
    Residence: "#7F77DD",
    Academic:  "#0057b8",
    Lab:       "#087e8b",
    Athletics: "#1D9E75",
    Admin:     "#EF9F27",
    Dining: "#D97706",
    Other:     "#888780"
  };

  var BC = { HVAC:"#378ADD", Lighting:"#EF9F27", Appliances:"#7F77DD", "Hot water":"#1D9E75", Other:"#888780" };

  var CAMPUS_BOUNDS = L.latLngBounds(
    [40.020, -75.365],   // southwest corner, with padding around campus
    [40.055, -75.325]    // northeast corner, with padding around campus
  );

  var map = L.map("map", {
    center: [40.0375, -75.3428],
    zoom: 16,
    minZoom: 14,
    maxZoom: 19,
    zoomControl: false,
    maxBounds: CAMPUS_BOUNDS,
    maxBoundsViscosity: 1.0
  });

  L.control.zoom({ position: "topright" }).addTo(map);

  // Local file URLs omit the page identity required by the tile provider.
  if (window.location.protocol === "file:") {
    var notice = document.getElementById("map-notice");
    notice.hidden = false;
    notice.textContent = "To load the map background, run START_SITE.bat in this folder, then open http://localhost:8000/campus-map.html.";
  } else {
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);
  }

  // Keep Leaflet's tile grid in sync with the actual panel dimensions.
  function refreshMapSize() { map.invalidateSize({ pan: false }); }
  if (typeof ResizeObserver !== "undefined") {
    var mapResizeObserver = new ResizeObserver(refreshMapSize);
    mapResizeObserver.observe(document.getElementById("map"));
  }
  window.addEventListener("load", refreshMapSize);
  window.addEventListener("resize", refreshMapSize);

  // ── MARKERS ──
  var markers = {};
  var currentFilter = "All";
  var activeId = null;

  // Inline SVG keeps icons crisp without extra fonts or image downloads.
  var SYMBOLS = {
    Residence: '<path d="M3 11 12 3l9 8M5 10v11h14V10M9 21v-8h6v8"/>',
    Lab: '<path d="M9 3h6M10 3v7L4 19a1.3 1.3 0 0 0 1 2h14a1.3 1.3 0 0 0 1-2l-6-9V3M7 15h10"/><circle cx="11" cy="18" r=".7" fill="currentColor" stroke="none"/>',
    Academic: '<path d="m3 8 9-5 9 5M4 9h16M5 9v11m5-11v11m4-11v11m5-11v11M3 21h18"/>',
    Athletics: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M6 5c7 4 7 10 0 14M18 5c-7 4-7 10 0 14"/>',
    Dining: '<path d="M3 3v5a3 3 0 0 0 6 0V3M6 3v18M17 3c-2 2-3 5-3 9h5V3h-2ZM19 12v9"/>',
    Admin: '<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h1m4 0h1M9 11h1m4 0h1M10 21v-6h4v6"/>',
    Other: '<rect x="4" y="6" width="16" height="15" rx="1"/><path d="M8 6V3h8v3M8 10h8M8 14h8M10 21v-3h4v3"/>'
  };

  function iconType(b) { return b.iconType || b.type; }
  function typeLabel(b) { return b.iconType === "Lab" ? "Academic / Lab" : b.type; }
  function symbolSvg(type) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + (SYMBOLS[type] || SYMBOLS.Other) + '</svg>';
  }
  function typeIcon(type) {
    return '<span class="type-icon" style="--marker-color:'+(COLOR[type] || COLOR.Other)+'">'+symbolSvg(type)+'</span>';
  }
  document.getElementById("legend-items").innerHTML = [
    ["Residence", "Residence"], ["Lab", "Lab / Science"],
    ["Academic", "Academic / School"], ["Athletics", "Athletics"],
    ["Admin", "Admin"], ["Dining", "Dining"], ["Other", "Other"]
  ].map(function(item) {
    return '<div class="legend-row">'+typeIcon(item[0])+item[1]+'</div>';
  }).join("");

  function makeIcon(type, big) {
    var c = COLOR[type] || COLOR.Other;
    var w = big ? 42 : 36;
    var h = big ? 52 : 44;
    return L.divIcon({
      className: "campus-marker",
      html: '<div class="campus-pin'+(big ? ' selected' : '')+'"><svg class="pin-outline" viewBox="0 0 36 44" aria-hidden="true"><path d="M18 42C14 36 2 26 2 18a16 16 0 1 1 32 0c0 8-12 18-16 24Z" fill="'+c+'" stroke="white" stroke-width="2"/></svg><span class="pin-symbol">'+symbolSvg(type)+'</span></div>',
      iconSize: [w, h],
      iconAnchor: [w/2, h],
      popupAnchor: [0, -h+4]
    });
  }

  function kwhHour(day) { return (day / 24).toFixed(1); }
  function kwhMonth(day) { return Math.round(day * 30.4).toLocaleString(); }

  function makePopup(b) {
    var brows = Object.entries(b.breakdown).map(function(e) {
      return '<div class="pb-row"><span class="pb-label">'+e[0]+'</span><div class="pb-track"><div class="pb-fill" style="width:'+e[1]+'%;background:'+(BC[e[0]]||"#888")+'"></div></div><span class="pb-pct">'+e[1]+'%</span></div>';
    }).join("");
    var resRow = b.residents ? '<div class="ps"><span class="ps-val">'+b.residents+'</span><span class="ps-label">Residents</span></div>' : '<div class="ps"><span class="ps-val">—</span><span class="ps-label">N/A</span></div>';
    return '<div class="popup-head"><span class="popup-type-badge">'+typeLabel(b)+'</span><p class="popup-name">'+b.name+'</p></div>'
      + '<div class="popup-body">'
      + '<div class="popup-stats">'
      + '<div class="ps"><span class="ps-val">'+b.kwhDay.toLocaleString()+'</span><span class="ps-label">kWh / day</span></div>'
      + '<div class="ps"><span class="ps-val">'+kwhHour(b.kwhDay)+'</span><span class="ps-label">kWh / hour</span></div>'
      + resRow
      + '</div>'
      + '<div class="popup-breakdown"><p class="pb-title">Energy breakdown</p>'+brows+'</div>'
      + '<div class="popup-tip">💡 <strong>Tip:</strong> '+b.tip+'</div>'
      + '<p class="popup-data-note">* Estimated figures for academic purposes. Replace with actual campus metering data.</p>'
      + '</div>';
  }

  BUILDINGS.forEach(function(b) {
    var m = L.marker([b.lat, b.lng], { icon: makeIcon(iconType(b), false), title: b.name + " (" + typeLabel(b) + ")", alt: b.name + " (" + typeLabel(b) + ")" }).addTo(map);
    m.bindPopup(makePopup(b), { maxWidth: 320, minWidth: 300, autoPan: true });
    m.on("click", function() { setActive(b.id); });
    m.on("popupclose", function() {
      m.setIcon(makeIcon(iconType(b), false));
      var el = document.querySelector(".bldg-item[data-id='"+b.id+"']");
      if (el) el.classList.remove("active");
      activeId = null;
    });
    markers[b.id] = m;
  });

  function setActive(id) {
    if (activeId && markers[activeId]) {
      var prev = BUILDINGS.find(function(b){return b.id===activeId;});
      markers[activeId].setIcon(makeIcon(iconType(prev), false));
      var prevEl = document.querySelector(".bldg-item[data-id='"+activeId+"']");
      if (prevEl) prevEl.classList.remove("active");
    }
    markers[id].openPopup();
    activeId = id;
    var b = BUILDINGS.find(function(b){return b.id===id;});
    markers[id].setIcon(makeIcon(iconType(b), true));
    var el = document.querySelector(".bldg-item[data-id='"+id+"']");
    if (el) { el.classList.add("active"); el.scrollIntoView({block:"nearest"}); }
  }

  // ── SIDEBAR LIST ──
  function renderList(filter) {
    var list = document.getElementById("bldg-list");
    var filtered = filter === "All" ? BUILDINGS : BUILDINGS.filter(function(b){ return b.type === filter; });
    // sort by kWhDay desc
    filtered = filtered.slice().sort(function(a,b){ return b.kwhDay - a.kwhDay; });
    list.innerHTML = filtered.map(function(b) {
      return '<div class="bldg-item" data-id="'+b.id+'" onclick="setActive('+b.id+'); map.setView(['+b.lat+','+b.lng+'],17);">'
        + typeIcon(iconType(b))
        + '<div class="bldg-item-info"><p class="bldg-item-name">'+b.name+'</p><p class="bldg-item-type">'+typeLabel(b)+'</p></div>'
        + '<div class="bldg-item-kwh">'+b.kwhDay.toLocaleString()+'<span>kWh/day</span></div>'
        + '</div>';
    }).join("");
  }

  function filterType(type, el) {
    currentFilter = type;
    document.querySelectorAll(".filter-pill").forEach(function(p){ p.classList.remove("on"); });
    el.classList.add("on");
    // show/hide markers
    BUILDINGS.forEach(function(b) {
      if (type === "All" || b.type === type) {
        if (!map.hasLayer(markers[b.id])) markers[b.id].addTo(map);
      } else {
        if (map.hasLayer(markers[b.id])) map.removeLayer(markers[b.id]);
      }
    });
    renderList(type);
  }

  renderList("All");
  </script>

  <script src="static/script.js"></script>
</body>
</html>
